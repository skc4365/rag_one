[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-kr"
version = "1.0.0"
description = "langchain-kr 튜토리얼 노트북용 헬퍼 (LangChain 1.x 대응)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "langchain-core>=1.6.0",
    "langchain-classic>=1.0.8",
    "langgraph>=1.2.11",
]

[project.optional-dependencies]
all = [
    "langchain-openai>=1.6.0",
    "anthropic",
    "openai",
    "deepl",
    "feedparser",
    "kiwipiepy",
    "nltk",
    "numpy",
    "pandas",
    "rank-bm25",
    "tavily-python",
    "olefile",
    "pinecone",
    "pinecone-text",
    "pyyaml",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_kr"]

[tool.hatch.build.targets.wheel.force-include]
"src/langchain_kr/assets" = "langchain_kr/assets"
